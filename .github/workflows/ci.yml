name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: anvil_test
          POSTGRES_USER: anvil
          POSTGRES_PASSWORD: anvil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U anvil -d anvil_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://anvil:anvil@localhost:5432/anvil_test
      ANVIL_TEST_DATABASE_URL: postgresql+psycopg://anvil:anvil@localhost:5432/anvil_test
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --group dev

      - name: Enable pgvector
        working-directory: backend
        run: |
          uv run python - <<'PY'
          import os
          from sqlalchemy import create_engine

          engine = create_engine(os.environ["DATABASE_URL"])
          with engine.begin() as connection:
              connection.exec_driver_sql("CREATE EXTENSION IF NOT EXISTS vector")
          engine.dispose()
          PY

      - name: Check Docker is available for sandbox integration tests
        run: docker info

      - name: Run backend tests
        working-directory: backend
        run: uv run --locked python -m pytest

  frontend:
    name: Frontend tests (when present)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check for frontend package
        id: frontend
        shell: bash
        run: |
          if [[ -f frontend/package.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No frontend/package.json yet; frontend tests are skipped."
          fi

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.frontend.outputs.present == 'true'
        run: npm ci --prefix frontend

      - name: Type-check frontend
        if: steps.frontend.outputs.present == 'true'
        run: npm run typecheck --prefix frontend

      - name: Run frontend tests
        if: steps.frontend.outputs.present == 'true'
        run: npm test --prefix frontend

  sbom:
    name: SBOM and vulnerability reports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Generate SBOM and OSV reports
        run: |
          mkdir -p "$RUNNER_TEMP/anvil-sbom"
          docker pull ghcr.io/vishal7pandey/anvil-sandbox-rtems:7
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace:ro" \
            --volume "$RUNNER_TEMP/anvil-sbom:/reports" \
            --entrypoint bash \
            ghcr.io/vishal7pandey/anvil-sandbox-rtems:7 \
            /workspace/sandbox/rtems/sbom.sh /workspace /reports

      - name: Upload SBOM and OSV reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sbom-osv-${{ github.run_id }}
          path: ${{ runner.temp }}/anvil-sbom/
          if-no-files-found: warn
