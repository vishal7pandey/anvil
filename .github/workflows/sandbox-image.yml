name: Build and publish RTEMS sandbox image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sandbox/rtems/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: image
        shell: bash
        run: echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: sandbox/rtems/Dockerfile
          push: true
          build-args: JOBS=4
          tags: |
            ghcr.io/vishal7pandey/anvil-sandbox-rtems:7
            ghcr.io/vishal7pandey/anvil-sandbox-rtems:${{ steps.image.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image
        run: docker run --rm ghcr.io/vishal7pandey/anvil-sandbox-rtems:${{ steps.image.outputs.sha_tag }} anvil-smoke
